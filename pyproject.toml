[project]
authors = [
  {name = "Jianyuan Wang", email = "jianyuan@robots.ox.ac.uk"},
]
dependencies = [
  "numpy<2",
  "Pillow",
  "einops",
  "safetensors",
  "opencv-python",
]
description = "VGGT-Omega feed-forward camera and depth reconstruction."
license = {file = "LICENSE"}
name = "vggt-omega"
readme = "README.md"
requires-python = ">=3.10"
version = "0.0.1"

[project.optional-dependencies]
demo = [
  "gradio>=5.17.1",
  "viser>=0.2.23",
  "tqdm",
  "scipy",
  "trimesh",
  "requests",
  "onnxruntime",
]
example = [
  "matplotlib",
  "pytorch3d @ git+https://github.com/facebookresearch/pytorch3d@c307c64",
  "torch==2.10.0",
  "torchcodec==0.10.0",
  "torchvision",
]
export = [
  "pycolmap>=3.10.0",
]

[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=61.0", "wheel"]

[tool.setuptools.packages.find]
include = ["vggt_omega*"]
where = ["."]

[tool.uv.extra-build-dependencies]
pytorch3d = ["torch==2.10.0"]
